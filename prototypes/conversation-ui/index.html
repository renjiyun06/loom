<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Loom · 对话界面原型</title>
<link rel="stylesheet" href="./styles.css">
<script src="./app.js" defer></script>
</head>
<body>
<header class="topbar">
 <div class="brand"><span>Loom<span class="brand-cn">织境</span></span><span class="top-divider"></span><span class="workspace-label">对话</span><span class="preview-badge" title="本地交互原型，使用演示数据，不会调用模型">本地原型</span></div>
 <nav class="top-actions" aria-label="界面操作">
  <button class="button button-quiet" id="replay"><span>流式演示</span></button>
  <button class="button button-quiet activity-toggle" id="activity-toggle" aria-expanded="true"><span>活动</span></button>
  <div class="menu-wrap"><button class="icon-button" id="more-toggle" aria-label="更多操作" aria-expanded="false"><span data-icon="more"></span></button><div class="menu" id="more-menu" hidden><button id="copy-conversation">复制对话 Markdown</button><button id="error-demo">查看异常展示</button><button id="reset-demo">重置原型</button></div></div>
 </nav>
</header>
<main class="workspace" id="workspace">
 <section class="chat-pane" aria-label="对话">
  <header class="chat-header"><h1>对话</h1><span class="session-context">当前会话</span></header>
  <div class="chat-scroll" id="chat-scroll"><div class="messages" id="messages"></div></div>
  <div class="composer-area">
   <button class="latest-button" id="jump-latest" hidden>有新内容 · 回到最新</button>
   <form class="composer" id="composer-form">
    <label for="prompt" class="sr-only">输入消息</label>
    <textarea id="prompt" placeholder="描述你想做的事…" rows="1" maxlength="12000"></textarea>
    <div class="composer-bottom"><div class="input-help"><kbd>Enter</kbd> 发送 <span>·</span> <kbd>Shift Enter</kbd> 换行</div><div class="composer-actions"><span class="generation-label" id="generation-label" hidden><span class="spinner"></span>正在演示</span><button class="button stop-button" id="stop" type="button" hidden>停止</button><button class="button send-button" id="send" type="submit">发送</button></div></div>
   </form>
   
  </div>
 </section>
 <div class="splitter" id="splitter" role="separator" aria-label="调整活动栏宽度" aria-orientation="vertical" tabindex="0"></div>
 <aside class="activity-pane" id="activity-pane" aria-label="实时活动">
  <div class="activity-header">
   <div class="activity-heading"><h2>实时活动</h2><span class="run-badge" id="run-badge">已完成</span><button class="icon-button small" id="collapse-all" title="收起全部详情" aria-label="收起全部详情"><span data-icon="collapse"></span></button></div>
   <div class="activity-toolbar"><div class="activity-filters" role="group" aria-label="筛选活动"><button class="filter active" data-filter="all">全部 <span id="all-count">6</span></button><button class="filter" data-filter="tools">工具 <span id="tool-count">3</span></button><button class="filter" data-filter="errors">异常 <span id="error-count">0</span></button></div><span id="run-stats">3 工具 · 12.4s</span></div>
  </div>
  <div class="activity-scroll" id="activity-scroll"><div class="activity-timeline" id="activity-list"></div></div>
  <footer class="activity-footer"><span><span id="event-status">本轮事件已同步</span></span><button class="text-button" id="raw-events">事件详情</button></footer>
 </aside>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="event-dialog"><div class="dialog-header"><div><h2>本轮事件</h2><p>用于查看交互的示例事件</p></div><button class="icon-button" id="dialog-close" aria-label="关闭详情"><span data-icon="close"></span></button></div><pre id="event-json"></pre><div class="dialog-footer"><button class="button button-quiet" id="copy-events">复制 JSON</button></div></dialog>
</body>
</html>
